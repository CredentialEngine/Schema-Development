# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build + Test
  jobs:
  - job: LinuxBuild
    displayName: Linux Build
    pool:
      vmImage: ubuntu-latest

    variables:
      BuildConfiguration: 'Debug'
      BuildPlatform: 'x64'
      DotNetVersion: '10.0.203'

    steps:

    - task: PowerShell@2
      displayName: "Set Build Number"
      inputs:
        targetType: inline
        script: |
          $year = (Get-Date).ToString('yyyy')
          $month = (Get-Date).ToString('MM')
          $day = (Get-Date).ToString('dd')
          $revision = "$env:BUILD_BUILDID"

          $version = "$year.$month.$day.$revision"

          Write-Host "##vso[build.updatebuildnumber]$version"
          Write-Host "##vso[task.setvariable variable=VersionNumber]$version"

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '$(DotNetVersion)'

    - script: dotnet --info
      displayName: '.NET Info'

    - task: DotNetCoreCLI@2
      displayName: 'Restore Packages'
      inputs:
        command: 'restore'
        projects: 'src/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build Solution'
      env:
        BUILD_CONFIGURATION: $(BuildConfiguration)
      inputs:
        command: 'build'
        projects: 'src/**/*.csproj'
        arguments: >
          --configuration $(BuildConfiguration)
          -p:Platform=$(BuildPlatform)
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=$(VersionNumber)

    - task: DotNetCoreCLI@2
      displayName: 'Run Tests'
      env:
        BUILD_CONFIGURATION: $(BuildConfiguration)
      inputs:
        command: 'test'
        projects: 'src/**/*Tests/*.csproj'
        arguments: >
          --configuration $(BuildConfiguration)
          -p:Platform=$(BuildPlatform)
          --no-build
          --verbosity normal

    - task: DotNetCoreCLI@2
      displayName: 'Publish CLI'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/Schema.CLI/Schema.CLI.csproj'
        arguments: >
          --configuration $(BuildConfiguration)
          -p:Platform=$(BuildPlatform)
          --output $(Build.ArtifactStagingDirectory)/publish/Schema.CLI
          --no-build
          -p:Version=$(VersionNumber)

    - task: ArchiveFiles@2
      displayName: 'Package Schema.zip'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/src/Schema'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/schema/Schema.$(VersionNumber).zip'
        replaceExistingArchive: true

    - task: PowerShell@2
      displayName: 'Write schema package metadata'
      inputs:
        targetType: inline
        script: |
          $schemaDirectory = "$(Build.ArtifactStagingDirectory)/schema"
          $schemaZip = Join-Path $schemaDirectory "Schema.$(VersionNumber).zip"
          $hash = (Get-FileHash -Path $schemaZip -Algorithm SHA256).Hash.ToLowerInvariant()

          Set-Content -Path (Join-Path $schemaDirectory "Schema.version.txt") -Value "$(VersionNumber)"
          Set-Content -Path (Join-Path $schemaDirectory "Schema.$(VersionNumber).zip.sha256") -Value "$hash  Schema.$(VersionNumber).zip"

          Write-Host "Schema package: $schemaZip"
          Write-Host "Schema version: $(VersionNumber)"
          Write-Host "Schema SHA256: $hash"

    - task: CopyFiles@2
      displayName: 'Stage binaries for signing'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          src/**/bin/$(BuildConfiguration)/**/*.dll
          src/**/bin/$(BuildConfiguration)/**/*.exe
        TargetFolder: '$(Build.ArtifactStagingDirectory)/signed-binaries'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Release
  displayName: Release
  dependsOn: Build

  jobs:
  - job: WindowsRelease
    displayName: Build + Sign + Publish

    pool:
      vmImage: windows-latest

    variables:
      BuildConfiguration: 'Release'
      DotNetVersion: '10.0.203'

      TrustedSigningEndpoint: '$(ARTIFACT_SIGNING_ENDPOINT)'
      TrustedSigningAccount: '$(ARTIFACT_SIGNING_RESOURCE_NAME)'
      TrustedSigningProfile: '$(CERTIFICATE_PROFILE_NAME)'

    steps:

    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: "Set Build Number"
      inputs:
        targetType: inline
        script: |
          $year = (Get-Date).ToString('yyyy')
          $month = (Get-Date).ToString('MM')
          $day = (Get-Date).ToString('dd')
          $revision = "$env:BUILD_BUILDID"

          $version = "$year.$month.$day.$revision"

          Write-Host "##vso[build.updatebuildnumber]$version"
          Write-Host "##vso[task.setvariable variable=VersionNumber]$version"

    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: sdk
        version: '$(DotNetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: restore
        projects: 'src/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: >
          --configuration $(BuildConfiguration)
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=$(VersionNumber)

    - powershell: |

        Write-Host "Looking for binaries..."

        Get-ChildItem `
          "$(Build.SourcesDirectory)\src" `
          -Recurse `
          -Include *.dll,*.exe |
        Select-Object FullName

      displayName: 'Debug binaries'

    - task: ArtifactSigning@1
      displayName: 'Sign binaries'
      inputs:
        AzureTenantID: '$(AZURE_TENANT_ID)'
        AzureClientID: '$(AZURE_CLIENT_ID)'
        AzureClientSecret: '$(AZURE_CLIENT_SECRET)'

        Endpoint: '$(TrustedSigningEndpoint)'
        ArtifactSigningAccountName: '$(TrustedSigningAccount)'
        CertificateProfileName: '$(TrustedSigningProfile)'

        FilesFolder: '$(Build.SourcesDirectory)'

        FilesFolderFilter: 'Schema.SDK.dll,Schema.CLI.dll,Schema.CLI.exe'
        FilesFolderRecurse: true
        FilesFolderDepth: 20

        FileDigest: 'SHA256'

        TimestampRfc3161: 'http://timestamp.acs.microsoft.com'
        TimestampDigest: 'SHA256'

    - task: DotNetCoreCLI@2
      displayName: 'Pack signed NuGet'
      inputs:
        command: pack
        packagesToPack: 'src/Schema.SDK/Schema.SDK.csproj'
        configuration: '$(BuildConfiguration)'
        packDirectory: '$(Build.ArtifactStagingDirectory)/nuget'
        nobuild: true
        versioningScheme: 'byEnvVar'
        versionEnvVar: 'VersionNumber'

    - task: DotNetCoreCLI@2
      displayName: 'Publish signed Schema.CLI'
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Schema.CLI/Schema.CLI.csproj'
        arguments: >
          --configuration $(BuildConfiguration)
          --output $(Build.ArtifactStagingDirectory)/publish/Schema.CLI
          --no-build
          -p:Version=$(VersionNumber)

    - task: ArchiveFiles@2
      displayName: 'Package Schema.CLI.zip'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish/Schema.CLI'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/release-assets/Schema.CLI.$(VersionNumber).zip'
        replaceExistingArchive: true

    - task: ArchiveFiles@2
      displayName: 'Package Schema.zip'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/src/Schema'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/release-assets/Schema.$(VersionNumber).zip'
        replaceExistingArchive: true

    - task: PowerShell@2
      displayName: 'Stage release assets'
      inputs:
        targetType: inline
        script: |
          $releaseDirectory = "$(Build.ArtifactStagingDirectory)/release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          $sdkPackage = Get-ChildItem "$(Build.ArtifactStagingDirectory)/nuget/*.nupkg" |
            Where-Object { $_.Name -notlike "*.symbols.nupkg" } |
            Select-Object -First 1

          if (-not $sdkPackage) {
            throw "Schema.SDK NuGet package was not found."
          }

          Copy-Item $sdkPackage.FullName (Join-Path $releaseDirectory $sdkPackage.Name) -Force

          $schemaZip = Join-Path $releaseDirectory "Schema.$(VersionNumber).zip"
          $cliZip = Join-Path $releaseDirectory "Schema.CLI.$(VersionNumber).zip"
          $sdkReleasePackage = Join-Path $releaseDirectory $sdkPackage.Name

          foreach ($asset in @($schemaZip, $cliZip, $sdkReleasePackage)) {
            if (-not (Test-Path $asset)) {
              throw "Release asset was not found: $asset"
            }
            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Release asset: $asset"
            Write-Host "SHA256: $hash"
          }

          Set-Content -Path (Join-Path $releaseDirectory "release.version.txt") -Value "$(VersionNumber)"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish release assets'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/release-assets'
        artifact: 'release-assets'
        publishLocation: pipeline

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate NuGet'

    - task: DotNetCoreCLI@2
      displayName: 'Push Schema.SDK NuGet package'
      inputs:
        command: push
        packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
        nuGetFeedType: internal
        publishVstsFeed: 'credential-engine'

    - task: GitHubRelease@1
      displayName: 'Create GitHub release'
      inputs:
        gitHubConnection: '$(GITHUB_SERVICE_CONNECTION)'
        repositoryName: 'CredentialEngine/Schema-Development'
        action: create
        target: '$(Build.SourceVersion)'
        tagSource: userSpecifiedTag
        tag: 'v$(VersionNumber)'
        title: 'Schema Development v$(VersionNumber)'
        releaseNotesSource: inline
        releaseNotesInline: |
          Schema Development release $(VersionNumber).

          Assets:
          - Schema.$(VersionNumber).zip - complete src/Schema tree
          - Schema.CLI.$(VersionNumber).zip - signed Schema CLI publish output
          - CTDL.Schema.SDK $(VersionNumber) - Schema SDK NuGet package
        assets: |
          $(Build.ArtifactStagingDirectory)/release-assets/Schema.$(VersionNumber).zip
          $(Build.ArtifactStagingDirectory)/release-assets/Schema.CLI.$(VersionNumber).zip
          $(Build.ArtifactStagingDirectory)/release-assets/CTDL.Schema.SDK.$(VersionNumber).nupkg
        isDraft: false
        isPreRelease: false
        addChangeLog: true
