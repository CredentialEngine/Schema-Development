# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  BuildConfiguration: 'Debug'
  BuildPlatform: 'x64'
  DotNetVersion: '10.0.203'

steps:
- task: PowerShell@2
  displayName: "Set Build Number to Year.Month.Day.BuildId"
  inputs:
    targetType: inline
    script: |
      $year = (Get-Date).ToString('yyyy')
      $month = (Get-Date).ToString('MM')
      $day = (Get-Date).ToString('dd')
      $revision = "$env:BUILD_BUILDID"
      $version = "$year.$month.$day.$revision"
      Write-Host "##vso[build.updatebuildnumber]$version"
      Write-Output "##vso[task.setvariable variable=VersionNumber]$version"

- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '$(DotNetVersion)'

- script: |
    dotnet --info
  displayName: 'Display .NET Info'

- task: DotNetCoreCLI@2
  displayName: 'Restore Packages'
  inputs:
    command: 'restore'
    projects: 'src/**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  env:
    BUILD_CONFIGURATION: $(BuildConfiguration)
  inputs:
    command: 'build'
    projects: 'src/**/*.csproj'
    arguments: >
      --configuration $(BuildConfiguration)
      -p:Platform=$(BuildPlatform)
      --no-restore
      -p:ContinuousIntegrationBuild=true
      -p:Version=$(VersionNumber)

- task: DotNetCoreCLI@2
  displayName: 'Run Tests'
  env:
    BUILD_CONFIGURATION: $(BuildConfiguration)
  inputs:
    command: 'test'
    projects: 'src/**/*Tests/*.csproj'
    arguments: >
      --configuration $(BuildConfiguration)
      -p:Platform=$(BuildPlatform)
      --no-build
      --verbosity normal

- task: DotNetCoreCLI@2
  displayName: 'Publish Artifacts'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'src/Schema.CLI/Schema.CLI.csproj'
    arguments: >
      --configuration $(BuildConfiguration)
      -p:Platform=$(BuildPlatform)
      --output $(Build.ArtifactStagingDirectory)/publish/Schema.CLI
      --no-build
      -p:Version=$(VersionNumber)

