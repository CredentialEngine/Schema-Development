- task: NuGetAuthenticate@1
  displayName: 'Authenticate to Azure Artifacts'

#
# Pack NuGet packages
#
- script: |
    dotnet pack src/Schema.SDK/Schema.SDK.csproj \
      --configuration $(BuildConfiguration) \
      --output $(Build.ArtifactStagingDirectory)/nuget \
      --no-build \
      -p:Platform=$(BuildPlatform) \
      -p:Version=$(VersionNumber) \
      -p:AssemblyVersion=$(VersionNumber) \
      -p:FileVersion=$(VersionNumber) \
      -p:InformationalVersion=$(VersionNumber)
  displayName: 'Pack NuGet Package'
